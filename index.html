<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Facilitator Picker</title>
  <style>
    :root {
      --bg: #f7f8fa;
      --text: #222;
      --subtext: #666;
      --accent: #3f6df6;
      --card: #ffffff;
    }

    body {
      font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", sans-serif;
      background: var(--bg);
      color: var(--text);
      text-align: center;
      padding-top: 120px;
    }

    h1 {
      font-size: 36px;
      font-weight: 600;
      margin-bottom: 40px;
      letter-spacing: 0.04em;
    }

    button {
      font-size: 18px;
      padding: 14px 40px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 8px 20px rgba(63,109,246,0.25);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(63,109,246,0.35);
    }

    #result {
      margin-top: 60px;
      font-size: 28px;
    }

    #r1 {
      color: var(--subtext);
      font-size: 18px;
      letter-spacing: 0.05em;
    }

    #r2 {
      margin-top: 20px;
      display: inline-block;
      font-size: 42px;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    #quote {
      margin-top: 28px;
      font-size: 15px;
      color: var(--subtext);
      font-style: italic;
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    .pop {
      animation: pop 0.5s ease;
    }

    @keyframes pop {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* 控えめな紙吹雪 */
    .confetti {
      position: fixed;
      width: 6px;
      height: 6px;
      top: -10px;
      background: var(--accent);
      opacity: 0.6;
      animation: fall 2.5s linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(100vh);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <h1>Next Facilitator</h1>
  <button onclick="pickFacilitator()">Select</button>

  <div id="result">
    <div id="r1"></div>
    <div id="r2"></div>
    <div id="quote"></div>
  </div>

  <script>
    const members = [
      "佐藤","寺本","関口","亀山","伊藤","岡本",
      "谷本","亀井","西山","平居","葉上","藤原"
    ];

    const fallbackQuotes = [
      "Done is better than perfect.",
      "Focus on what matters.",
      "Small steps lead to big results.",
      "Simplicity is the ultimate sophistication."
    ];

    function pickFacilitator() {
      const r1 = document.getElementById("r1");
      const r2 = document.getElementById("r2");
      const quote = document.getElementById("quote");

      let count = 0;
      r1.textContent = "Selecting next facilitator";
      r2.textContent = "";
      quote.style.opacity = 0;
      quote.textContent = "";

      const interval = setInterval(() => {
        r2.textContent = members[Math.floor(Math.random() * members.length)];
        count++;

        if (count > 18) {
          clearInterval(interval);

          const name = members[Math.floor(Math.random() * members.length)];
          r2.textContent = name;
          r2.classList.add("pop");
          setTimeout(() => r2.classList.remove("pop"), 500);

          launchConfetti();
          loadQuote();
        }
      }, 100);
    }

    async function loadQuote() {
      const quote = document.getElementById("quote");

      try {
        const res = await fetch("https://zenquotes.io/api/today");
        const data = await res.json();
        quote.textContent = `"${data[0].q}" — ${data[0].a}`;
      } catch (e) {
        const q = fallbackQuotes[Math.floor(Math.random() * fallbackQuotes.length)];
        quote.textContent = `"${q}"`;
      }

      setTimeout(() => quote.style.opacity = 1, 300);
    }

    function launchConfetti() {
      for (let i = 0; i < 60; i++) {
        const confetti = document.createElement("div");
        confetti.className = "confetti";
        confetti.style.left = Math.random() * 100 + "vw";
        confetti.style.animationDuration =
          (2 + Math.random()) + "s";
        document.body.appendChild(confetti);
        setTimeout(() => confetti.remove(), 2500);
      }
    }
  </script>

</body>
</html>
